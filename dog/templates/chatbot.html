       body {

            margin: 0;
            padding: 20px;
       }

        .chat-container {
            width: 700px;
            max-width: 90%;
            display: flex;
            flex-direction: column;
            border: 2px solid #ccc;
            border-radius: 10px;
            padding: 10px;
            background-color: #fff;
            margin: 20px auto;
        }

        .chat-box {
            height: 360px;
            overflow-y: auto;
            padding: 10px;
            border-bottom: 1px solid #ccc;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .input-container {
            display: flex;
            padding: 10px;
            gap: 8px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
            transition: border 0.3s ease-in-out;
        }

        input[type="text"]:focus {
            border-color: #2980b9;
        }

        button {
            padding: 12px 16px;
            background-color: #2c3e50;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s ease-in-out;
        }

        button:hover {
            background-color: #34495e;
        }

        /* Chat messages */
        .message {
            max-width: 80%;
            padding: 12px;
            border-radius: 10px;
            font-size: 15px;
            line-height: 1.4;
            display: inline-block;
        }

        .user-message {
            align-self: flex-end;
            background-color: #2c3e50;
            color: white;
            border-top-right-radius: 0;
        }

        .bot-message {
           background-color: #d4f8c6; /* Light green */
            align-self: flex-start; /* Align bot messages to the left */
            color: #333;
            border-top-left-radius: 0;
        }

        /* Keyword suggestions */
        .keyword {
            cursor: pointer;
            color: #2980b9;
            text-decoration: underline;
            display: inline-block;
            margin: 5px;
            font-size: 14px;
        }

        .keyword:hover {
            text-decoration: none;
            font-weight: bold;
        }

        .suggestions {
            margin-top: 8px;
            padding: 5px;
        }

        function findKeywords() {
            const userInput = document.getElementById("user-input").value.toLowerCase();
            displayMessage(userInput, 'user');

            // Clear input field
            document.getElementById("user-input").value = "";
            document.getElementById("suggestions").innerHTML = ""; // Clear suggestions

            // Check for keywords
            if (keywords[userInput]) {
                displayMessage(keywords[userInput], 'bot');
            } else {
                displayMessage("No matching keywords found. Try 'breeds', 'food', 'training', or 'exercise'.", 'bot');
            }
        }

        function showSuggestions() {
            const userInput = document.getElementById("user-input").value.toLowerCase();
            const suggestionsDiv = document.getElementById("suggestions");
            suggestionsDiv.innerHTML = ""; // Clear previous suggestions

            const matchedKeywords = Object.keys(keywords).filter(keyword => keyword.startsWith(userInput));
            if (matchedKeywords.length > 0) {
                matchedKeywords.forEach(keyword => {
                    const suggestion = document.createElement("div");
                    suggestion.className = "keyword";
                    suggestion.textContent = keyword;

                    suggestion.onclick = () => {
                        document.getElementById("user-input").value = keyword; // Set input to the selected keyword
                        findKeywords(); // Trigger the findKeywords function
                    };

                    suggestionsDiv.appendChild(suggestion);
                });
            }
        }

        function displayMessage(message, sender) {
            const chatBox = document.getElementById("chat-box");
            const messageDiv = document.createElement("div");
            messageDiv.className = "message " + (sender === 'user' ? 'user-message' : 'bot-message');
            messageDiv.innerHTML = message;
            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight; // Scroll to the bottom
        }
    </script>
